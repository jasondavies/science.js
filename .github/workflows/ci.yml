name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18.0.0', 18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check committed bundles match the build
        run: git diff --exit-code -- dist
      - name: Check every test file is run
        shell: bash
        run: |
          diff <(find test -name '*-test.js' | sed 's#^test/#./#' | sort) \
               <(sed -n 's/^import "\(.*\)";$/\1/p' test/index.js | sort)
      - name: Check package contents and installed import
        shell: bash
        run: |
          pack_dir=$(mktemp -d)
          trap 'rm -rf "$pack_dir"' EXIT
          npm pack --ignore-scripts --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          git ls-files src > "$pack_dir/sources.txt"
          node --input-type=module - "$pack_dir/pack.json" "$pack_dir/sources.txt" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync(process.argv[2], 'utf8')),
                sources = readFileSync(process.argv[3], 'utf8').trim().split('\n');
          assert.deepEqual(pack.files.map(file => file.path).sort(), [
            'CHANGELOG.md', 'LICENSE', 'README.md', 'dist/science.js', 'dist/science.min.js', 'index.d.ts', 'index.js',
            'package.json', ...sources
          ].sort());
          JS
          mkdir "$pack_dir/consumer"
          cd "$pack_dir/consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$pack_dir"/*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { dirname, join } from 'node:path';
          import { runInNewContext } from 'node:vm';
          import * as science from 'science';
          import { loess, mean } from 'science';

          const packageJson = createRequire(`${process.cwd()}/`).resolve('science/package.json'),
                { version, exports } = JSON.parse(readFileSync(packageJson, 'utf8'));
          assert.equal(globalThis.science, undefined, 'importing science must not define a global');
          assert.equal(science.version, version);
          assert.equal(mean([1, 2, 3, 4]), 2.5);
          assert.deepEqual(loess([1, 2, 3, 4, 5], [2, 4, 6, 8, 10], {bandwidth: .6}), [2, 4, 6, 8, 10]);
          assert.match(readFileSync(join(dirname(packageJson), exports['.'].types), 'utf8'), /export function loess/);

          for (const file of ['science.js', 'science.min.js']) {
            const context = {};
            runInNewContext(readFileSync(`node_modules/science/dist/${file}`, 'utf8'), context);
            assert.deepEqual(Object.keys(context), ['science'], file);
            assert.deepEqual(Object.keys(context.science).sort(), Object.keys(science).sort(), file);
          }
          JS
      - name: Check unused functions are tree-shaken
        shell: bash
        run: |
          pack_dir=$(mktemp -d)
          trap 'rm -rf "$pack_dir"' EXIT
          npm pack --ignore-scripts --pack-destination "$pack_dir" > /dev/null
          mkdir "$pack_dir/consumer"
          cd "$pack_dir/consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$pack_dir"/*.tgz
          echo 'import { mean } from "science"; console.log(mean([1, 2]));' > entry.js
          "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" entry.js --bundle --format=esm --outfile=bundle.js
          node bundle.js | grep -qx 1.5
          # Without "sideEffects": false, the frozen kernels object would be kept.
          ! grep -qE 'robustnessIterations|epanechnikov' bundle.js
